<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg:#eef1f4; --card:#fff; --ink:#14232e; --mute:#5d707d; --line:#d5dee4; --live:#0a7d5a; --off:#8a97a0; --accent:#1b6fd1; --err:#c43d2f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1a21; --card:#172630; --ink:#e6eef2; --mute:#8fa3b0; --line:#2a3d49; --live:#3ecf9f; --off:#667784; --accent:#5bb3e8; --err:#ff7b6b; } }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  body { display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding:10px 14px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; font-weight:650; }
  #status { font-size:12px; color:var(--mute); text-align:right; }
  #add { display:flex; gap:6px; padding:8px 10px 0; background:var(--card); flex-wrap:wrap; }
  #add input { flex:1; min-width:0; padding:8px 10px; font-size:14px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
  #add button { padding:8px 14px; font-size:14px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  #msg { flex-basis:100%; font-size:12px; color:var(--mute); min-height:16px; padding-bottom:6px; }
  #msg.err { color:var(--err); }
  #map { flex:1; min-height:0; }
  #list { max-height:44vh; overflow-y:auto; padding:8px; background:var(--card); border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
  .ac { position:relative; border:1px solid var(--line); border-radius:8px; padding:9px 11px; cursor:pointer; background:var(--bg); }
  .ac.sel { border-color:var(--accent); }
  .ac b { display:flex; align-items:center; gap:7px; font-size:14px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--off); }
  .live .dot { background:var(--live); }
  .ac p { margin:5px 0 0; font-size:12px; color:var(--mute); line-height:1.5; }
  .ac a { color:var(--accent); }
  .rm { position:absolute; top:4px; right:6px; border:0; background:none; color:var(--mute); font-size:18px; cursor:pointer; line-height:1; }
  .log { margin:8px 0 0; padding:8px 0 0; border-top:1px solid var(--line); font-size:12px; list-style:none; }
  .log li { display:flex; gap:8px; padding:2px 0; } .log time { color:var(--mute); flex:0 0 108px; }
  .note { font-size:11px; color:var(--mute); margin-top:6px; }
  .plane svg { filter:drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  @media (min-width:800px) { body { flex-direction:row; flex-wrap:wrap; } header, #add { width:100%; } #map { height:auto; } #list { max-height:none; width:330px; border-top:0; border-left:1px solid var(--line); } }
</style>
</head>
<body>
<header><h1>Fleet tracker</h1><span id="status">Loading…</span></header>
<div id="add">
  <input id="q" placeholder="Hex code, call sign, registration or Flightradar24 link" autocomplete="off" autocapitalize="off">
  <button id="go">Add</button>
  <div id="msg"></div>
</div>
<div id="map"></div>
<div id="list"></div>

<script>
const DEFAULT_FLEET = [{ hex:"A2FB16", name:"N291VK" }, { hex:"A000B8", name:"N1HG" }];
const REFRESH_SECONDS = 10;
const COLORS = ["#e4572e","#1b7fbd","#8a4fd6","#1f9d55","#d98e04","#c2185b","#00838f","#6d4c41"];
const SOURCES = ["https://api.adsb.lol/v2","https://api.airplanes.live/v2","https://opendata.adsb.fi/api/v2","https://api.adsb.one/v2"];
const OFFLINE_MS = 5 * 60e3, GAP_MS = 10 * 60e3, TAXI_KT = 3;

const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

const fleet = load("fleet", null) || DEFAULT_FLEET.map(a => ({ ...a }));
const events = load("events", {}), state = load("state", {});
let serverMode = false;  // true when the Netlify backend (24/7 event logging) is available
const persistFleet = () => {
  const f = fleet.map(({ hex, name }) => ({ hex, name }));
  save("fleet", f);
  if (serverMode) fetch("/api/fleet", { method:"POST", headers:{ "content-type":"application/json" }, body:JSON.stringify(f) }).catch(() => {});
};

const map = L.map("map", { worldCopyJump:true }).setView([20, 0], 2);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:18, attribution:"&copy; OpenStreetMap contributors" }).addTo(map);
const markers = {}, trails = {}, last = {}, latest = {}, list = document.getElementById("list");
let colorIdx = 0, selected = null;

function icon(color, track, big) {
  const s = big ? 34 : 26;
  return L.divIcon({ className:"plane", iconSize:[s, s], iconAnchor:[s/2, s/2],
    html:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="transform:rotate(${track || 0}deg)"><path fill="${color}" stroke="#fff" stroke-width="1" d="M12 2l2 7 8 4v2l-8-2v5l2 2v1.5L12 20l-4 1.5V20l2-2v-5l-8 2v-2l8-4z"/></svg>` });
}

// ---- Data: ask every source at once and keep the freshest position ----
async function getJSON(url) { try { const r = await fetch(url); return r.ok ? await r.json() : null; } catch (e) { return null; } }
function fromOpenSky(d, hex) {
  const s = d && d.states && d.states[0]; if (!s) return [];
  return [{ hex, lat:s[6], lon:s[5], alt_baro:s[8] ? "ground" : (s[7] != null ? s[7] * 3.28084 : null), gs:s[9] != null ? s[9] * 1.94384 : null,
    track:s[10], baro_rate:s[11] != null ? s[11] * 196.85 : null, squawk:s[14], flight:s[1], seen_pos:s[3] ? Date.now()/1000 - s[3] : 0 }];
}
async function lookup(kind, value) {
  const v = encodeURIComponent(value.toLowerCase());
  const paths = kind === "hex" ? ["hex"] : kind === "callsign" ? ["callsign"] : ["reg", "registration"];
  const jobs = [];
  SOURCES.forEach(b => paths.forEach(p => jobs.push(getJSON(`${b}/${p}/${v}`).then(d => d && (d.ac || d.aircraft || [])))));
  if (kind === "hex") jobs.push(getJSON(`https://opensky-network.org/api/states/all?icao24=${v}`).then(d => d && fromOpenSky(d, value.toLowerCase())));
  const res = await Promise.all(jobs);
  const answered = res.filter(r => r !== null).length;
  if (!answered) throw new Error("Data sources unreachable");
  const all = res.flat().filter(a => a && a.lat != null);
  all.sort((a, b) => (a.seen_pos ?? a.seen ?? 0) - (b.seen_pos ?? b.seen ?? 0));
  return { ac:all[0] || null, answered, total:jobs.length };
}

// ---- Timeline: came online, taxiing, takeoff, landing, offline ----
function log(a, label) {
  (events[a.hex] = events[a.hex] || []).unshift({ t:Date.now(), label });
  events[a.hex].length = Math.min(events[a.hex].length, 60);
  save("events", events);
}
function track(a, p) {
  if (serverMode) return;  // the server records events around the clock
  const now = Date.now(), st = state[a.hex] = state[a.hex] || {};
  if (p) {
    const ground = p.alt_baro === "ground", moving = (p.gs || 0) > TAXI_KT, mode = ground ? "ground" : "air";
    if (!st.mode || st.mode === "offline" || now - st.seen > GAP_MS) {
      log(a, "Came online " + (ground ? "on the ground" : "in the air" + (typeof p.alt_baro === "number" ? " at " + Math.round(p.alt_baro) + " ft" : "")));
      st.landed = false; st.moving = false;
    } else {
      if (st.mode === "ground" && mode === "air") { log(a, "Took off"); st.landed = false; }
      if (st.mode === "air" && mode === "ground") { log(a, "Landed"); st.landed = true; st.moving = true; }
      if (mode === "ground" && moving && !st.moving) log(a, st.landed ? "Taxiing to parking" : "Started taxiing out");
      if (mode === "ground" && !moving && st.moving) log(a, "Stopped moving");
    }
    if (mode === "ground") st.moving = moving;
    st.mode = mode; st.seen = now;
  } else if (st.mode && st.mode !== "offline" && now - st.seen > OFFLINE_MS) {
    log(a, "Went offline"); st.mode = "offline";
  }
  save("state", state);
}

// ---- Cards ----
function setup(a) {
  a.color = COLORS[colorIdx++ % COLORS.length];
  trails[a.hex] = L.polyline([], { color:a.color, weight:2, opacity:.7 }).addTo(map);
  const el = document.createElement("div"); el.id = "c-" + a.hex;
  el.onclick = () => select(a.hex, true);
  list.appendChild(el); render(a);
}
function select(hex, fly) {
  selected = selected === hex && !fly ? null : hex;
  fleet.forEach(a => { render(a); if (markers[a.hex]) markers[a.hex].setIcon(icon(a.color, (latest[a.hex] || {}).track, a.hex === selected)); });
  if (fly && last[hex]) map.flyTo([last[hex].lat, last[hex].lon], Math.max(map.getZoom(), 9));
}
function render(a) {
  const el = document.getElementById("c-" + a.hex), p = latest[a.hex], live = !!p;
  el.className = "ac" + (live ? " live" : "") + (selected === a.hex ? " sel" : "");
  const alt = p ? (p.alt_baro === "ground" ? "On ground" : p.alt_baro != null ? Math.round(p.alt_baro) + " ft" : "–") : "";
  let info = live
    ? `${alt} · ${p.gs != null ? Math.round(p.gs) + " kt" : "–"} · ${p.track != null ? Math.round(p.track) + "°" : "–"}<br>${esc(p.r || a.hex)}${p.t ? " · " + esc(p.t) : ""}${p.flight && p.flight.trim() ? " · " + esc(p.flight.trim()) : ""}`
    : `No position from the free sources<br>${last[a.hex] ? "Last seen " + new Date(last[a.hex].time).toLocaleTimeString() : "Not seen yet"}`;
  let more = "";
  if (selected === a.hex) {
    const ev = events[a.hex] || [];
    if (live) more += `<br>Vertical rate ${p.baro_rate != null ? Math.round(p.baro_rate) + " ft/min" : "–"} · Squawk ${esc(p.squawk || "–")}<br>Position age ${Math.round(p.seen_pos ?? p.seen ?? 0)} s`;
    more += `<ul class="log">${ev.length ? ev.map(e => `<li><time>${new Date(e.t).toLocaleString([], { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" })}</time><span>${esc(e.label)}</span></li>`).join("") : "<li>No events yet</li>"}</ul><div class="note">${serverMode ? "Events are recorded 24/7 by the server, even when this page is closed." : "Server logging is not set up, so events are only recorded while this page is open."}</div>`;
  }
  el.innerHTML = `<button class="rm" title="Remove" aria-label="Remove">×</button><b><span class="dot"></span>${esc(a.name)}</b><p>${info}${more}<br><a href="https://globe.adsbexchange.com/?icao=${a.hex.toLowerCase()}" target="_blank" rel="noopener">Open on ADS-B Exchange</a></p>`;
  el.querySelector(".rm").onclick = e => { e.stopPropagation(); remove(a.hex); };
  el.querySelector("a").onclick = e => e.stopPropagation();
}
function remove(hex) {
  const i = fleet.findIndex(a => a.hex === hex); if (i < 0) return;
  fleet.splice(i, 1);
  if (markers[hex]) map.removeLayer(markers[hex]);
  map.removeLayer(trails[hex]);
  [markers, trails, last, latest].forEach(o => delete o[hex]);
  document.getElementById("c-" + hex).remove(); persistFleet();
}

// ---- Adding aircraft ----
function parseInput(raw) {
  let s = raw.trim();
  if (/^https?:\/\//i.test(s) || /flightradar24\.com/i.test(s)) {
    let segs; try { segs = new URL(/^https?:/i.test(s) ? s : "https://" + s).pathname.split("/").filter(Boolean); } catch (e) { return null; }
    const find = k => { const i = segs.indexOf(k); return i >= 0 ? segs[i + 1] : null; };
    const reg = find("aircraft"); if (reg) return { kind:"reg", value:reg };
    const cs = find("flights") || find("flight") || segs[0];
    return cs ? { kind:"callsign", value:cs } : null;
  }
  s = s.replace(/^0x/i, "").replace(/\s+/g, "");
  if (/^[0-9a-f]{6}$/i.test(s)) return { kind:"hex", value:s };
  return /^[a-z0-9-]{2,10}$/i.test(s) ? { kind:"any", value:s } : null;
}
const msg = document.getElementById("msg"), q = document.getElementById("q"), go = document.getElementById("go");
const say = (t, err) => { msg.textContent = t; msg.className = err ? "err" : ""; };
async function addAircraft() {
  const p = parseInput(q.value);
  if (!p) return say("Enter a 6-character hex code, a call sign, a registration or a Flightradar24 link.", true);
  go.disabled = true; say("Looking up…");
  try {
    let hex, name, ac = null;
    if (p.kind === "hex") { hex = p.value.toUpperCase(); name = hex; ac = (await lookup("hex", hex)).ac; }
    else {
      for (const k of p.kind === "any" ? ["callsign", "reg"] : [p.kind]) { ac = (await lookup(k, p.value)).ac; if (ac) break; }
      if (!ac) return say("Not transmitting right now, so I can't find its hex code. Enter the hex code instead.", true);
      hex = ac.hex.toUpperCase(); name = p.value.toUpperCase();
    }
    if (ac && ac.r) name = ac.r;
    if (fleet.some(a => a.hex === hex)) return say(name + " is already on the map.", true);
    const a = { hex, name }; fleet.push(a); setup(a); persistFleet();
    q.value = ""; say("Added " + name + "."); update();
  } catch (e) { say(e.message, true); }
  finally { go.disabled = false; }
}
go.onclick = addAircraft;
q.addEventListener("keydown", e => { if (e.key === "Enter") addAircraft(); });

// ---- Refresh loop ----
async function update() {
  const status = document.getElementById("status"); let ok = 0, total = 0, live = 0;
  try {
    await Promise.all(fleet.map(async a => {
      const r = await lookup("hex", a.hex), p = r.ac; ok = r.answered; total = r.total;
      if (p) {
        live++; latest[a.hex] = p; last[a.hex] = { lat:p.lat, lon:p.lon, time:Date.now() };
        const pos = [p.lat, p.lon], ic = icon(a.color, p.track, a.hex === selected);
        if (markers[a.hex]) markers[a.hex].setLatLng(pos).setIcon(ic).setOpacity(1);
        else markers[a.hex] = L.marker(pos, { icon:ic }).addTo(map).bindTooltip(a.name).on("click", () => select(a.hex, true));
        const t = trails[a.hex], ll = t.getLatLngs(), l = ll[ll.length - 1];
        if (!l || l.lat !== p.lat || l.lng !== p.lon) t.addLatLng(pos);
      } else { delete latest[a.hex]; if (markers[a.hex]) markers[a.hex].setOpacity(.35); }
      track(a, p || null);
      if (document.getElementById("c-" + a.hex)) render(a);
    }));
    const pts = Object.values(last).map(l => [l.lat, l.lon]);
    if (!update.fitted && pts.length) { map.fitBounds(pts, { padding:[60, 60], maxZoom:10 }); update.fitted = true; }
    status.textContent = `${live}/${fleet.length} live · ${ok}/${total} sources answered · ${new Date().toLocaleTimeString()}`;
  } catch (e) { status.textContent = "Data sources unreachable. Retrying…"; }
}
async function pullEvents() {
  try {
    const r = await fetch("/api/events"); if (!r.ok) return;
    const e = await r.json();
    Object.keys(events).forEach(k => delete events[k]); Object.assign(events, e);
    fleet.forEach(a => document.getElementById("c-" + a.hex) && render(a));
  } catch (e) {}
}
async function init() {
  try {
    const r = await fetch("/api/fleet");
    if (r.ok) { const f = await r.json(); if (Array.isArray(f) && f.length) { serverMode = true; fleet.length = 0; fleet.push(...f); } }
  } catch (e) {}
  if (serverMode) { await pullEvents(); setInterval(pullEvents, 30000); }
  fleet.forEach(setup); update(); setInterval(update, REFRESH_SECONDS * 1000);
}
init();
</script>
</body>
</html>

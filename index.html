<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b6fd1">
<title>Fleet tracker</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14232e;--mute:#5d707d;--line:#d5dee4;--live:#0a7d5a;--off:#8a97a0;--accent:#1b6fd1;--err:#c43d2f}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a21;--card:#172630;--ink:#e6eef2;--mute:#8fa3b0;--line:#2a3d49;--live:#3ecf9f;--off:#667784;--accent:#5bb3e8;--err:#ff7b6b}}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
body{display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:650}#status{font-size:12px;color:var(--mute)}
.tabs{display:flex;gap:4px}.tabs button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#toolbar{display:flex;gap:6px;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
#toolbar input,#toolbar select{padding:7px 10px;font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#toolbar input[type=search]{flex:1;min-width:140px}
#toolbar button,.btn{padding:7px 12px;font-size:13px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
#msg{font-size:12px;color:var(--mute)}#msg.err{color:var(--err)}
#main{flex:1;min-height:0;display:flex;flex-direction:column}#map{flex:1;min-height:200px}
#panel{max-height:42vh;overflow:auto;background:var(--card);border-top:1px solid var(--line);padding:8px}
#board{display:none;overflow:auto;padding:8px;background:var(--card);flex:1}#board.on,#panel.on{display:block}#map.hidden{display:none}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--card)}tr{cursor:pointer}tr:hover{background:var(--bg)}
.ac{position:relative;border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;background:var(--bg);margin-bottom:8px}.ac.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ac b{display:flex;align-items:center;gap:7px;font-size:14px}.dot{width:9px;height:9px;border-radius:50%;background:var(--off);flex-shrink:0}.live .dot{background:var(--live)}
.ac p{margin:5px 0 0;font-size:12px;color:var(--mute);line-height:1.5}.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:99px;background:var(--line);margin-left:4px}
.rm{position:absolute;top:4px;right:6px;border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer}
.log{margin:8px 0 0;padding:8px 0 0;border-top:1px solid var(--line);font-size:12px;list-style:none;max-height:240px;overflow:auto}
.log li{display:flex;gap:8px;padding:3px 0;flex-wrap:wrap}.log time{color:var(--mute);flex:0 0 120px}.coords{flex-basis:100%;font-size:11px;color:var(--mute);padding-left:128px}
.note{font-size:11px;color:var(--mute);margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:999;padding:16px}.modal.on{display:flex}
.modal .box{background:var(--card);border-radius:12px;padding:16px;max-width:420px;width:100%;max-height:90vh;overflow:auto}
.modal label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}.modal input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.modal .row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
#playback{display:none;padding:8px 12px;background:var(--card);border-top:1px solid var(--line);gap:10px;align-items:center;font-size:12px}#playback.on{display:flex}#playback input[type=range]{flex:1}
@media(min-width:900px){#main{flex-direction:row}#map{flex:1;min-height:0}#panel{max-height:none;width:380px;border-top:0;border-left:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>Fleet tracker</h1>
  <div class="tabs"><button type="button" id="tabMap" class="on">Map</button><button type="button" id="tabBoard">Board</button></div>
  <span id="status">Starting…</span>
</header>
<div id="toolbar">
  <input id="q" type="search" placeholder="Add hex / callsign / reg / FR24 link" autocomplete="off">
  <button type="button" id="go">Add</button>
  <input id="filter" type="search" placeholder="Filter fleet / tags" autocomplete="off">
  <button type="button" class="btn ghost" id="btnSettings">Settings</button>
  <button type="button" class="btn ghost" id="btnHealth">Health</button>
  <button type="button" class="btn ghost" id="btnExport">Export CSV</button>
  <span id="msg"></span>
</div>
<div id="main">
  <div id="map"></div>
  <div id="playback"><button type="button" class="btn ghost" id="pbPlay">Play trail</button><input type="range" id="pbRange" min="0" max="0" value="0"><span id="pbLabel">—</span></div>
  <div id="panel" class="on"></div>
  <div id="board"></div>
</div>
<div class="modal" id="modal"><div class="box"><h3 id="modalTitle" style="margin:0 0 8px;font-size:16px">Settings</h3><div id="modalBody"></div><div class="row"><button type="button" class="btn ghost" id="modalCancel">Close</button><button type="button" class="btn" id="modalSave">Save</button></div></div></div>
<script src="/app.js"></script>
</body>
</html>

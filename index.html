<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg:#eef1f4; --card:#fff; --ink:#14232e; --mute:#5d707d; --line:#d5dee4;
    --live:#0a7d5a; --off:#8a97a0; --accent:#1b6fd1; --err:#c43d2f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1a21; --card:#172630; --ink:#e6eef2; --mute:#8fa3b0; --line:#2a3d49;
      --live:#3ecf9f; --off:#667784; --accent:#5bb3e8; --err:#ff7b6b;
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  body { display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding:10px 14px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; font-weight:650; }
  #status { font-size:12px; color:var(--mute); text-align:right; }
  #add { display:flex; gap:6px; padding:8px 10px 0; background:var(--card); flex-wrap:wrap; }
  #add input { flex:1; min-width:0; padding:8px 10px; font-size:14px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
  #add button { padding:8px 14px; font-size:14px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  #add button:disabled { opacity:.6; cursor:wait; }
  #msg { flex-basis:100%; font-size:12px; color:var(--mute); min-height:16px; padding-bottom:6px; }
  #msg.err { color:var(--err); }
  #map { flex:1; min-height:0; }
  #list { max-height:44vh; overflow-y:auto; padding:8px; background:var(--card); border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
  .ac { position:relative; border:1px solid var(--line); border-radius:8px; padding:9px 11px; cursor:pointer; background:var(--bg); }
  .ac.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .ac b { display:flex; align-items:center; gap:7px; font-size:14px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--off); flex-shrink:0; }
  .live .dot { background:var(--live); box-shadow:0 0 0 3px color-mix(in srgb, var(--live) 25%, transparent); }
  .ac p { margin:5px 0 0; font-size:12px; color:var(--mute); line-height:1.5; }
  .ac a { color:var(--accent); }
  .rm { position:absolute; top:4px; right:6px; border:0; background:none; color:var(--mute); font-size:18px; cursor:pointer; line-height:1; padding:4px; }
  .rm:hover { color:var(--err); }
  .log { margin:8px 0 0; padding:8px 0 0; border-top:1px solid var(--line); font-size:12px; list-style:none; max-height:220px; overflow-y:auto; }
  .log li { display:flex; gap:8px; padding:3px 0; flex-wrap:wrap; }
  .log time { color:var(--mute); flex:0 0 108px; }
  .log .coords { flex-basis:100%; font-size:11px; color:var(--mute); padding-left:116px; }
  .note { font-size:11px; color:var(--mute); margin-top:6px; }
  .banner { font-size:12px; padding:8px 12px; background:color-mix(in srgb, var(--accent) 12%, var(--card)); border-bottom:1px solid var(--line); color:var(--mute); }
  .banner strong { color:var(--ink); }
  .plane svg { filter:drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  @media (min-width:800px) {
    body { flex-direction:row; flex-wrap:wrap; }
    header, #add, .banner { width:100%; }
    #map { height:auto; }
    #list { max-height:none; width:360px; border-top:0; border-left:1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Fleet tracker</h1>
  <span id="status">Starting…</span>
</header>
<div class="banner" id="banner">
  <strong>24/7 server tracking</strong> — taxi / takeoff / landing events are recorded in the background even when this page is closed. Open an aircraft to see the full timeline with positions.
</div>
<div id="add">
  <input id="q" placeholder="Hex, callsign, registration, or Flightradar24 link" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="go">Add</button>
  <div id="msg"></div>
</div>
<div id="map"></div>
<div id="list"></div>
<script>
/* frontend loads fleet+events from /api/fleet; continuous tracking is server-side */
const REFRESH_SECONDS = 10;
const COLORS = ["#e4572e","#1b7fbd","#8a4fd6","#1f9d55","#d98e04","#c2185b","#00838f","#6d4c41"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&","<":"<",">":">",'"':""","'":"&#39;" }[c]));
let fleet = [], events = {}, serverLast = {}, serverState = {};
const markers = {}, trails = {}, latest = {};
let colorIdx = 0, selected = null, updating = false, fitted = false;
const map = L.map("map", { worldCopyJump: true }).setView([30, -40], 3);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "&copy; OpenStreetMap" }).addTo(map);
const list = document.getElementById("list");
function icon(color, track, big) {
  const s = big ? 34 : 26;
  return L.divIcon({ className: "plane", iconSize: [s, s], iconAnchor: [s/2, s/2],
    html: `<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="transform:rotate(${track||0}deg)"><path fill="${color}" stroke="#fff" stroke-width="1" d="M12 2l2 7 8 4v2l-8-2v5l2 2v1.5L12 20l-4 1.5V20l2-2v-5l-8 2v-2l8-4z"/></svg>` });
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
  return data;
}
async function lookup(kind, value) {
  const q = new URLSearchParams({ kind, value: String(value).trim() });
  return api(`/api/lookup?${q}`);
}
function ensureCard(a) {
  if (!a.color) a.color = COLORS[colorIdx++ % COLORS.length];
  if (!trails[a.hex]) trails[a.hex] = L.polyline([], { color: a.color, weight: 2, opacity: 0.7 }).addTo(map);
  if (!document.getElementById("c-" + a.hex)) {
    const el = document.createElement("div");
    el.id = "c-" + a.hex;
    el.onclick = () => select(a.hex, true);
    list.appendChild(el);
  }
}
function select(hex, fly) {
  selected = selected === hex && !fly ? null : hex;
  fleet.forEach(a => {
    render(a);
    if (markers[a.hex]) markers[a.hex].setIcon(icon(a.color, (latest[a.hex] || serverLast[a.hex] || {}).track, a.hex === selected));
  });
  const pos = latest[hex] || serverLast[hex];
  if (fly && pos?.lat != null) map.flyTo([pos.lat, pos.lon], Math.max(map.getZoom(), 9));
}
function fmtCoords(e) {
  if (e.lat == null || e.lon == null) return "";
  const alt = e.alt === "ground" ? "ground" : (e.alt != null ? Math.round(e.alt) + " ft" : "");
  return `${e.lat.toFixed(4)}, ${e.lon.toFixed(4)}${alt ? " · " + alt : ""}`;
}
function render(a) {
  const el = document.getElementById("c-" + a.hex);
  if (!el) return;
  const p = latest[a.hex], last = serverLast[a.hex], live = !!p;
  el.className = "ac" + (live ? " live" : "") + (selected === a.hex ? " sel" : "");
  const alt = p ? (p.alt_baro === "ground" ? "On ground" : p.alt_baro != null ? Math.round(p.alt_baro) + " ft" : "–") : (last?.alt === "ground" ? "Last: ground" : last?.alt != null ? "Last: " + Math.round(last.alt) + " ft" : "");
  let info = live
    ? `${alt} · ${p.gs != null ? Math.round(p.gs) + " kt" : "–"} · ${p.track != null ? Math.round(p.track) + "°" : "–"}<br>${esc(p.r || a.hex)}${p.t ? " · " + esc(p.t) : ""}${p.flight && String(p.flight).trim() ? " · " + esc(String(p.flight).trim()) : ""}`
    : `No live position<br>${last ? "Last seen " + new Date(last.time).toLocaleString() : "Not seen yet"}`;
  let more = "";
  if (selected === a.hex) {
    const ev = events[a.hex] || [];
    if (live) more += `<br>Vertical ${p.baro_rate != null ? Math.round(p.baro_rate) + " ft/min" : "–"} · Squawk ${esc(p.squawk || "–")}<br>Age ${Math.round(p.seen_pos ?? p.seen ?? 0)} s · Source ${esc(p._src || "–")}`;
    more += `<ul class="log">${ev.length ? ev.map(e => { const coords = fmtCoords(e); return `<li><time>${new Date(e.t).toLocaleString([], { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit", second:"2-digit" })}</time><span>${esc(e.label)}</span>${coords ? `<div class="coords">${esc(coords)}</div>` : ""}</li>`; }).join("") : "<li>No events yet — server poll will fill this in</li>"}</ul><div class="note">Timeline is recorded by the server around the clock (not only while this page is open).</div>`;
  }
  el.innerHTML = `<button class="rm" title="Remove" aria-label="Remove">×</button><b><span class="dot"></span>${esc(a.name)}</b><p>${info}${more}<br><a href="https://globe.adsbexchange.com/?icao=${a.hex.toLowerCase()}" target="_blank" rel="noopener">ADS-B Exchange</a></p>`;
  el.querySelector(".rm").onclick = e => { e.stopPropagation(); remove(a.hex); };
  el.querySelector("a").onclick = e => e.stopPropagation();
}
async function remove(hex) {
  try { await api(`/api/fleet?hex=${encodeURIComponent(hex)}`, { method: "DELETE" }); }
  catch (e) { say(e.message, true); return; }
  fleet = fleet.filter(a => a.hex !== hex);
  if (markers[hex]) map.removeLayer(markers[hex]);
  if (trails[hex]) map.removeLayer(trails[hex]);
  delete markers[hex]; delete trails[hex]; delete latest[hex];
  document.getElementById("c-" + hex)?.remove();
  if (selected === hex) selected = null;
}
function parseInput(raw) {
  let s = raw.trim(); if (!s) return null;
  if (/^https?:\/\//i.test(s) || /flightradar24\.com/i.test(s)) {
    let segs; try { segs = new URL(/^https?:/i.test(s) ? s : "https://" + s).pathname.split("/").filter(Boolean); } catch { return null; }
    const find = k => { const i = segs.indexOf(k); return i >= 0 ? segs[i + 1] : null; };
    const reg = find("aircraft"); if (reg) return { kind: "reg", value: reg };
    const cs = find("flights") || find("flight") || segs[0];
    return cs ? { kind: "callsign", value: cs } : null;
  }
  s = s.replace(/^0x/i, "").replace(/\s+/g, "");
  if (/^[0-9a-f]{6}$/i.test(s)) return { kind: "hex", value: s };
  if (/^[a-z0-9-]{2,10}$/i.test(s)) return { kind: "any", value: s };
  return null;
}
const msg = document.getElementById("msg"), q = document.getElementById("q"), go = document.getElementById("go");
const say = (t, err) => { msg.textContent = t || ""; msg.className = err ? "err" : ""; };
async function addAircraft() {
  const p = parseInput(q.value);
  if (!p) return say("Enter a 6-char hex, callsign, registration, or FR24 link.", true);
  go.disabled = true; say("Looking up…");
  try {
    const body = p.kind === "hex" ? { hex: p.value.toUpperCase() } : { query: p.value, kind: p.kind === "any" ? undefined : p.kind };
    const r = await api("/api/fleet", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    q.value = ""; say("Added " + (r.aircraft?.name || r.aircraft?.hex) + " — server will track it 24/7.");
    await bootstrap(); updateLive();
  } catch (e) { say(e.message || "Add failed", true); }
  finally { go.disabled = false; }
}
go.onclick = addAircraft;
q.addEventListener("keydown", e => { if (e.key === "Enter") addAircraft(); });
async function bootstrap() {
  const data = await api("/api/fleet");
  fleet = (data.fleet || []).map(a => { const prev = fleet.find(x => x.hex === a.hex); return { ...a, color: prev?.color }; });
  events = data.events || {}; serverLast = data.last || {}; serverState = data.state || {};
  [...list.children].forEach(el => {
    const hex = el.id.replace(/^c-/, "");
    if (!fleet.some(a => a.hex === hex)) {
      el.remove();
      if (markers[hex]) map.removeLayer(markers[hex]);
      if (trails[hex]) map.removeLayer(trails[hex]);
    }
  });
  fleet.forEach(ensureCard); fleet.forEach(render);
  const pts = Object.values(serverLast).filter(l => l.lat != null).map(l => [l.lat, l.lon]);
  if (!fitted && pts.length) { map.fitBounds(pts, { padding: [60, 60], maxZoom: 10 }); fitted = true; }
}
async function updateLive() {
  if (updating || !fleet.length) {
    if (!fleet.length) document.getElementById("status").textContent = "No aircraft — add one above";
    return;
  }
  updating = true;
  const status = document.getElementById("status");
  let live = 0;
  try {
    try { const data = await api("/api/fleet"); events = data.events || events; serverLast = data.last || serverLast; serverState = data.state || serverState; } catch {}
    await Promise.all(fleet.map(async a => {
      ensureCard(a);
      try {
        const r = await lookup("hex", a.hex);
        const p = r.ac;
        if (p && p.lat != null) {
          live++; latest[a.hex] = p;
          const pos = [p.lat, p.lon], ic = icon(a.color, p.track, a.hex === selected);
          if (markers[a.hex]) markers[a.hex].setLatLng(pos).setIcon(ic).setOpacity(1);
          else markers[a.hex] = L.marker(pos, { icon: ic }).addTo(map).bindTooltip(a.name).on("click", () => select(a.hex, true));
          const t = trails[a.hex];
          if (t) {
            const ll = t.getLatLngs(), l = ll[ll.length - 1];
            if (!l || l.lat !== p.lat || l.lng !== p.lon) t.addLatLng(pos);
            if (ll.length > 500) t.setLatLngs(ll.slice(-400));
          }
        } else {
          delete latest[a.hex];
          if (markers[a.hex]) markers[a.hex].setOpacity(0.35);
          const last = serverLast[a.hex];
          if (last?.lat != null && !markers[a.hex]) {
            markers[a.hex] = L.marker([last.lat, last.lon], { icon: icon(a.color, last.track, false), opacity: 0.35 }).addTo(map).bindTooltip(a.name).on("click", () => select(a.hex, true));
          }
        }
      } catch { delete latest[a.hex]; if (markers[a.hex]) markers[a.hex].setOpacity(0.35); }
      render(a);
    }));
    status.textContent = `${live}/${fleet.length} live · server timeline on · ${new Date().toLocaleTimeString()}`;
  } catch { status.textContent = "Live update issue — retrying…"; }
  finally { updating = false; }
}
(async function init() {
  try {
    await bootstrap(); await updateLive();
    fetch("/api/poll").catch(() => {});
  } catch (e) {
    document.getElementById("status").textContent = "Server store not ready — see setup note";
    document.getElementById("banner").innerHTML = `<strong>Setup needed:</strong> add <code>GITHUB_TOKEN</code> (repo contents write) on the Vercel project, then hit <code>/api/poll</code> every 1–2 minutes via cron-job.org. ${esc(e.message)}`;
    say(e.message, true);
  }
  setInterval(updateLive, REFRESH_SECONDS * 1000);
  setInterval(() => bootstrap().catch(() => {}), 60 * 1000);
})();
</script>
</body>
</html>
